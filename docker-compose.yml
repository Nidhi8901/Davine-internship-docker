services:
  web:
    image: week4-docker-app:latest
    container_name: week4-compose-app
    ports:
      - "8082:80"
    volumes:
      - week4-volume:/usr/share/nginx/html
    networks:
      - week4-network

volumes:
  week4-volume:
    external: true

networks:
  week4-network:
    external: true